blueprint:
  name: F1 Race Status Light Controller
  description: >
    Flashes a light whenever the F1 track status switches to Safety Car (SC)
    or Virtual Safety Car (VSC), stopping as soon as the status changes to
    anything else. When the status goes to Red Flag, flashing stops and the
    light turns solid red, staying red until the session has actually ended
    and the track is clear. Once that's confirmed, the light turns solid
    green briefly as a "green flag" signal, then switches off. Session end
    is detected using the current-session sensor and session-status sensor
    (more reliable than a simple session on/off sensor, since the track can
    go clear mid-session too). Requires an F1 integration exposing a track
    status sensor (e.g. `sensor.f1_session_track_status`) with SC, VSC, RED,
    and CLEAR among its states, a current-session sensor (e.g.
    `sensor.f1_session_current_session`), and a session-status sensor (e.g.
    `sensor.f1_session_session_status`) that reads "Live" while a session
    is in progress.
  domain: automation
  source_url: https://github.com/
  input:
    f1_track_status_sensor:
      name: F1 Track Status Sensor
      description: >
        Sensor whose state reflects the current track status, e.g.
        sensor.f1_session_track_status. Must include SC, VSC, RED, and
        CLEAR as possible states.
      selector:
        entity:
          domain: sensor
    f1_current_session_sensor:
      name: F1 Current Session Sensor
      description: >
        Sensor whose state is the name of the currently active session, e.g.
        sensor.f1_session_current_session. Used to confirm the session has
        actually finished (state is no longer one of Practice 1, Practice 2,
        Practice 3, Qualifying, Sprint Qualifying, Sprint, or Race).
      selector:
        entity:
          domain: sensor
    f1_session_status_sensor:
      name: F1 Session Status Sensor
      description: >
        Sensor that reads "Live" while a session is actively in progress,
        e.g. sensor.f1_session_session_status. Used together with the
        current-session sensor to confirm the session has ended.
      selector:
        entity:
          domain: sensor
    target_light:
      name: Light to flash
      description: The light entity that will flash or change color.
      selector:
        entity:
          domain: light
    flash_color:
      name: SC / VSC flash color
      description: RGB color used for the Safety Car and Virtual Safety Car flash.
      default: [255, 185, 0]
      selector:
        color_rgb: {}
    red_color:
      name: Red flag color
      description: RGB color used for the solid red-flag light.
      default: [255, 0, 0]
      selector:
        color_rgb: {}
    green_flag_color:
      name: Green flag color
      description: RGB color used for the solid "green flag" light once the session has ended.
      default: [0, 255, 0]
      selector:
        color_rgb: {}
    green_flag_duration_seconds:
      name: Green flag light duration (s)
      description: How long the green flag light stays on before switching off.
      default: 30
      selector:
        number:
          min: 5
          max: 300
          step: 5
          unit_of_measurement: s
          mode: box
    sc_flash_interval_ms:
      name: Safety Car flash speed (ms)
      description: On/off delay in milliseconds during a full Safety Car period. Lower = faster flash.
      default: 1850
      selector:
        number:
          min: 200
          max: 5000
          step: 50
          unit_of_measurement: ms
          mode: box
    vsc_flash_interval_ms:
      name: Virtual Safety Car flash speed (ms)
      description: On/off delay in milliseconds during a Virtual Safety Car period. Lower = faster flash.
      default: 1500
      selector:
        number:
          min: 200
          max: 5000
          step: 50
          unit_of_measurement: ms
          mode: box

mode: restart

triggers:
  - trigger: state
    entity_id: !input f1_track_status_sensor
    id: SC
    to: SC
  - trigger: state
    entity_id: !input f1_track_status_sensor
    id: VSC
    to: VSC
  - trigger: state
    entity_id: !input f1_track_status_sensor
    id: RED
    to: RED
  - trigger: state
    entity_id: !input f1_track_status_sensor
    id: GREEN_FLAG
    to: CLEAR
  - trigger: state
    entity_id: !input f1_current_session_sensor
    id: GREEN_FLAG
  - trigger: state
    entity_id: !input f1_session_status_sensor
    id: GREEN_FLAG

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - SC
        sequence:
          - repeat:
              while:
                - condition: state
                  entity_id: !input f1_track_status_sensor
                  state: SC
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input target_light
                  data:
                    brightness_pct: 100
                    rgb_color: !input flash_color
                - delay:
                    milliseconds: !input sc_flash_interval_ms
                - action: light.turn_off
                  target:
                    entity_id: !input target_light
                  data: {}
                - delay:
                    milliseconds: !input sc_flash_interval_ms
      - conditions:
          - condition: trigger
            id:
              - VSC
        sequence:
          - repeat:
              while:
                - condition: state
                  entity_id: !input f1_track_status_sensor
                  state: VSC
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input target_light
                  data:
                    brightness_pct: 100
                    rgb_color: !input flash_color
                - delay:
                    milliseconds: !input vsc_flash_interval_ms
                - action: light.turn_off
                  target:
                    entity_id: !input target_light
                  data: {}
                - delay:
                    milliseconds: !input vsc_flash_interval_ms
      - conditions:
          - condition: trigger
            id:
              - RED
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input target_light
            data:
              brightness_pct: 100
              rgb_color: !input red_color
      - conditions:
          - condition: trigger
            id:
              - GREEN_FLAG
          - condition: state
            entity_id: !input f1_track_status_sensor
            state: CLEAR
          - condition: not
            conditions:
              - condition: state
                entity_id: !input f1_current_session_sensor
                state:
                  - "Practice 1"
                  - "Practice 2"
                  - "Practice 3"
                  - "Qualifying"
                  - "Sprint Qualifying"
                  - "Sprint"
                  - "Race"
          - condition: not
            conditions:
              - condition: state
                entity_id: !input f1_session_status_sensor
                state: "Live"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input target_light
            data:
              brightness_pct: 100
              rgb_color: !input green_flag_color
          - delay:
              seconds: !input green_flag_duration_seconds
          - action: light.turn_off
            target:
              entity_id: !input target_light
            data: {}
